<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGS — CEO Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f6fb;--surface:#ffffff;--surf2:#f0f3f9;--surf3:#e8ecf4;
    --border:#dde2ee;--border2:#c8cedf;--muted:#6b7a99;--text:#1a2035;--sub:#8a94ad;
    --attention:#dc2626;--review:#7c3aed;--play:#2563eb;--delivery:#0f766e;--ok:#16a34a;
  }
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);padding:24px 32px 60px}

  .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:20px;flex-wrap:wrap;gap:16px}
  .hdr .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .hdr h1{font-size:23px;font-weight:700;letter-spacing:-.4px;margin-top:6px}
  .hdr p{font-size:12.5px;color:var(--muted);margin-top:4px}
  .hdr p a{color:var(--play);font-weight:600;text-decoration:none}
  .hdr .today{font-size:13px;color:var(--text);font-weight:600;margin-top:8px}
  .open-top{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;color:var(--play);text-decoration:none}
  .open-top:hover{text-decoration:underline}
  .whoami{font-size:11px;color:var(--sub);margin-top:6px}
  .whoami b{color:var(--text)}
  .whoami a{color:var(--play);cursor:pointer;text-decoration:none;font-weight:600}
  .top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .btn{font-size:11px;padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;font-weight:600;letter-spacing:.03em}
  .btn:hover{background:var(--surf2);color:var(--text)}
  .btn.active{background:#1a2035;color:#fff;border-color:#1a2035}
  .btn.edit{background:#d97706;color:#fff;border-color:#d97706}
  .views{display:flex;gap:7px}

  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .sum{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 15px;flex:1;min-width:170px}
  .sum .ic{font-size:17px;line-height:1}
  .sum .n{font-size:19px;font-weight:700}
  .sum .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;line-height:1.25}
  .sum.attention{border-color:#f3c0c0;background:#fef4f4}
  .sum.attention .n{color:var(--attention)}
  .sum.done .n{color:var(--ok)}

  .day{margin-top:22px}
  .day.hide{display:none}
  .day-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--border2);padding-bottom:7px;margin-bottom:2px}
  .day-h .dow{font-size:13px;font-weight:700}
  .day-h .date{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  .day-h.is-today .dow{color:var(--play)}
  .day-h .todaytag{font-size:9.5px;font-weight:700;color:#fff;background:var(--play);border-radius:4px;padding:2px 7px;letter-spacing:.05em}

  .row{display:grid;grid-template-columns:34px 1.35fr 1.9fr 190px;align-items:center;gap:8px;padding:11px 6px;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .ic{font-size:17px;text-align:center;line-height:1}
  .row .game{font-weight:700;font-size:13.5px}
  .row .game .chip{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;padding:1px 6px;border-radius:9px;border:1px solid var(--border2);color:var(--muted);background:var(--surf2);margin-right:7px;vertical-align:1px}
  .row .game .chip.ig{color:#0e5a4a;border-color:#a6d8cb;background:#e6f5f0}
  .row .game .chip.v2{color:#3730a3;border-color:#c3c0f0;background:#eeedfb}
  .row .game .jira{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);font-weight:500;margin-left:7px}
  .row .game .sent{font-size:10px;font-weight:700;color:var(--ok);margin-left:8px}
  .row .ms{font-size:12.5px;color:#3d465e}
  .row .ms .lnk{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--play);text-decoration:none;border:1px solid var(--border2);border-radius:6px;padding:2px 7px;margin-left:8px;background:var(--surf2);vertical-align:1px}
  .row .ms .lnk:hover{background:#eaf1fe;border-color:#cfe0fb}
  .row.attention{background:#fef7f7;margin:0 -6px;padding-left:12px;padding-right:12px;border-left:3px solid var(--attention)}
  .action{justify-self:end;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:6px 12px;border-radius:6px;white-space:nowrap;text-transform:uppercase;cursor:pointer;transition:filter .1s;border:1px solid transparent}
  .action:hover{filter:brightness(.96)}
  .action.review{color:var(--review);background:#f3edff;border-color:#ddd0fb}
  .action.play{color:var(--play);background:#eaf1fe;border-color:#cfe0fb}
  .action.decision{color:var(--attention);background:#fdeeee;border-color:#f6cccc}
  .rm{justify-self:end;border:none;background:none;color:var(--sub);cursor:pointer;font-size:15px;padding:0 4px}
  .rm:hover{color:var(--attention)}
  .pmo-appr{border:1px solid #bfe9cf;background:#eafaf0;color:#15803d;border-radius:6px;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;font-family:inherit}
  .pmo-appr:hover{background:#d9f5e4}

  .empty{background:var(--surface);border:1px dashed var(--border2);border-radius:10px;padding:40px;text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
  .empty b{color:var(--text)}
  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;gap:10px}
  .legend{display:flex;gap:15px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}

  .drw-ov{position:fixed;inset:0;background:rgba(15,20,40,.35);opacity:0;pointer-events:none;transition:.15s;z-index:40}
  .drw-ov.open{opacity:1;pointer-events:auto}
  .drw{position:fixed;top:0;right:0;height:100%;width:430px;max-width:94vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 34px rgba(0,0,0,.13);transform:translateX(102%);transition:transform .18s;z-index:41;display:flex;flex-direction:column;padding:22px 22px 20px;overflow-y:auto}
  .drw.open{transform:none}
  .drw .x{position:absolute;top:14px;right:16px;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  .drw .d-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .drw h3{font-size:17px;font-weight:700;margin:5px 0 2px;padding-right:20px}
  .drw .d-sub{font-size:12px;color:var(--muted)}
  .drw label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
  .drw input[type=text],.drw input[type=email],.drw input[type=date],.drw input[type=password],.drw select,.drw textarea{width:100%;font-family:inherit;font-size:13px;color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:9px 11px;outline:none}
  .drw textarea{min-height:70px;resize:vertical}
  .drw input:focus,.drw select:focus,.drw textarea:focus{border-color:var(--play)}
  .d-openrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .d-open{flex:1;min-width:140px;text-align:center;font-size:12px;font-weight:700;color:var(--play);text-decoration:none;border:1px solid #cfe0fb;background:#eaf1fe;border-radius:8px;padding:11px}
  .d-open:hover{filter:brightness(.97)}
  .srch-res{border:1px solid var(--border);border-radius:8px;margin-top:6px;max-height:190px;overflow-y:auto}
  .srch-res .r{padding:8px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border)}
  .srch-res .r:last-child{border-bottom:none}
  .srch-res .r:hover{background:var(--surf2)}
  .srch-res .r .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);margin-left:6px}
  .cur-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .cur-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;background:var(--surf2);border:1px solid var(--border);border-radius:7px}
  .cur-item.drag-over{border-color:var(--play);border-style:dashed}
  .cur-item .grip{cursor:grab;color:var(--sub);font-size:13px}
  .cur-item .g{font-weight:600;flex:1;min-width:0}
  .cur-item .d{color:var(--sub);font-family:'IBM Plex Mono',monospace;font-size:10px}
  .appr-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;border-bottom:1px solid var(--border)}
  .appr-item .g{font-weight:600;flex:1}
  .appr-item .m{color:var(--sub);font-size:10.5px}
  .d-foot{margin-top:auto;padding-top:18px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
  .d-msg{font-size:11px;color:var(--muted);margin-right:auto;max-width:170px}
  .d-msg.err{color:var(--attention)}
  .d-btn{font-size:12px;font-weight:700;padding:9px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit}
  .d-btn:hover{background:var(--surf2)}
  .d-btn.primary{background:#1a2035;color:#fff;border-color:#1a2035}
  .note-box{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:#3d465e;margin-top:8px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2035;color:#fff;font-size:12.5px;font-weight:600;padding:11px 20px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <header class="hdr">
    <div>
      <div class="eyebrow">Pong Game Studios · Games PMO</div>
      <h1>PGS — CEO Summary</h1>
      <p>CEO + Creative Director review list · a front door to the <a href="game-pipeline.html">Game Pipeline</a></p>
      <div class="today" id="todayLine">—</div>
      <a href="game-pipeline.html" class="open-top">Open full pipeline →</a>
      <div class="whoami" id="whoami"></div>
    </div>
    <div class="top-actions">
      <button class="btn edit" id="editBtn">＋ Manage list (PMO)</button>
      <div class="views">
        <button class="btn" data-view="0">TODAY</button>
        <button class="btn active" data-view="7">7 DAYS</button>
        <button class="btn" data-view="30">30 DAYS</button>
      </div>
    </div>
  </header>

  <section class="summary" id="summary"></section>
  <div id="calendar"></div>

  <footer class="foot">
    <div class="legend">
      <span>🔴 Decision</span><span>🎨 Creative review</span><span>🎮 Ready to play</span><span>✓ Approved</span>
    </div>
  </footer>

  <div class="drw-ov" id="drwOv"></div>
  <aside class="drw" id="drw" aria-hidden="true"></aside>
  <div class="toast" id="toast"></div>

<script src="dashboard-data-v2.js"></script>
<script src="dashboard-data-ig.js"></script>
<script>
// ============================================================
//  CEO Summary — PMO-curated review board (V2 + iGaming)
//  Fern (no login): review → Approve opens an email to the PMO.
//  PMO (team token): manage the list, and mark items approved (they clear
//  off the board into the Approved history). Links auto-fetched → GP_DATA.
// ============================================================
const GH_OWNER='mayankyadav1994', GH_REPO='pong-exec-dashboard';
const GH_API=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;
const GH_PAT_KEY='gp_github_pat', GH_USER_KEY='gp_github_user';   // shared with pipeline (PMO)
const SENT_KEY='pgs_ceo_sent';   // per-browser: which items this viewer has emailed
const REVIEW_PATH='ceo-review.json';

const ACTIONS = {
  decision: { icon:'🔴', label:'Decision required', cls:'decision' },
  review:   { icon:'🎨', label:'Review & approve',  cls:'review'   },
  play:     { icon:'🎮', label:'Play & review',      cls:'play'     },
};
let ITEMS=[], APPROVED=[], ALLGAMES=[], GAME_LINKS={}, REVIEW_CONFIG={}, VIEW='7', CUR=null, PICKED=null, DRAG_FROM=null;

const esch = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const esca = s => esch(s).replace(/"/g,'&quot;');
const asDate = s => { const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const midnight = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays = (d,n)=> new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fmtDate = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtDOW  = d => d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase();
const fmtWhen = s => { const d=new Date(s); return isNaN(d)?'' : d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };
const stripName = n => String(n).replace(/^Gen2\s*-?\s*Game:\s*/i,'').replace(/^Game:\s*/i,'');
const TODAY = midnight(new Date());

function getPat(){ try{return localStorage.getItem(GH_PAT_KEY)||'';}catch(e){return '';} }
function getUser(){ try{return localStorage.getItem(GH_USER_KEY)||'';}catch(e){return '';} }
function isEditor(){ return !!getPat(); }
function getSent(){ try{return new Set(JSON.parse(localStorage.getItem(SENT_KEY)||'[]'));}catch(e){return new Set();} }
function markSent(jira){ try{ const s=getSent(); s.add(jira); localStorage.setItem(SENT_KEY, JSON.stringify([...s])); }catch(e){} }
function pmoEmail(){ return (REVIEW_CONFIG.pmo_email||'').trim(); }

async function ghFetch(url, opts){
  opts = opts||{};
  const headers = Object.assign({'Authorization':'token '+getPat(),'Accept':'application/vnd.github+json','Content-Type':'application/json'}, opts.headers||{});
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if(!r.ok){ let m='HTTP '+r.status; try{const j=await r.json(); m+=': '+(j.message||'');}catch(e){} throw new Error(m); }
  return r.status===204 ? {} : r.json();
}

async function loadReview(){
  try{
    const r = await fetch(REVIEW_PATH+'?ts='+Date.now());
    if(r.ok){ const j = await r.json(); ITEMS=j.items||[]; APPROVED=j.approved||[]; REVIEW_CONFIG=j.config||{}; }
  }catch(e){ ITEMS=[]; APPROVED=[]; }
}
function loadAllGames(){
  ALLGAMES=[]; GAME_LINKS={};
  for(const key of ['v2','ig']){
    const d=(window.GP_DATA||{})[key]; if(!d||!d.games) continue;
    const label=key==='v2'?'V2':'iGaming';
    for(const g of d.games){
      ALLGAMES.push({ jira:g.jira, game:stripName(g.name), board:key, boardLabel:label });
      if(g.review_url||g.play_url) GAME_LINKS[g.jira]={ review:g.review_url||'', play:g.play_url||'' };
    }
  }
}
function itemLinks(it){ const g=GAME_LINKS[it.jira]||{}; return { review:(g.review||it.review||''), play:(g.play||it.play||'') }; }
function linkChips(it){
  const L=itemLinks(it); let s='';
  if(L.review) s+=`<a class="lnk" href="${esca(L.review)}" target="_blank" rel="noopener" title="Open the Confluence review page">📄 Review</a>`;
  if(L.play)   s+=`<a class="lnk" href="${esca(L.play)}" target="_blank" rel="noopener" title="Open the game to play-test">▶ Play</a>`;
  return s;
}

function render(){
  const maxDays=+VIEW, sent=getSent();
  const inWin = ITEMS.filter(it=>{ const d=asDate(it.date); return d && (d-TODAY)/86400000 <= maxDays && (d-TODAY)/86400000 >= -3; });
  const c={ decision:0, review:0, play:0 };
  inWin.forEach(it=>{ if(c[it.action]!=null) c[it.action]++; });
  document.getElementById('summary').innerHTML =
     sumCard('attention','🔴',c.decision,'Decisions')+sumCard('','🎨',c.review,'Creative reviews')
   + sumCard('','🎮',c.play,'Ready to play')+sumCard('done','✓',APPROVED.length,'Approved');

  const byDay=new Map();
  inWin.forEach(it=>{ const k=+asDate(it.date); (byDay.get(k)||byDay.set(k,[]).get(k)).push(it); });
  const days=[...byDay.keys()].sort((a,b)=>a-b);
  const cal=document.getElementById('calendar');
  if(!days.length){
    cal.innerHTML=`<div class="empty"><b>No games on the review list for this window.</b><br>${isEditor()?'Use <b>Manage list</b> — or <b>Send to CEO review</b> from the pipeline.':'Nothing pending for you right now.'}</div>`;
    return;
  }
  cal.innerHTML=days.map(k=>{
    const d=new Date(k), isToday=k===+TODAY, isTom=k===+addDays(TODAY,1);
    const rows=byDay.get(k).map(it=>{
      const a=ACTIONS[it.action]||ACTIONS.review; const idx=ITEMS.indexOf(it);
      const sentMark = sent.has(it.jira) ? `<span class="sent" title="You emailed the PMO — awaiting sign-off">✓ sent</span>` : '';
      const actionCell=`<div class="action ${a.cls}" data-idx="${idx}" role="button" tabindex="0">${a.label} →</div>`;
      const editCell=isEditor()?`<button class="pmo-appr" data-appr="${idx}" title="Mark approved (clears the board)">✓ approve</button>`:'';
      return `<div class="row ${it.action==='decision'?'attention':''}">`
        + `<div class="ic">${a.icon}</div>`
        + `<div class="game"><span class="chip ${it.board}">${esch(it.boardLabel||it.board)}</span>${esch(it.game)}<span class="jira">${esch(it.jira)}</span>${sentMark}</div>`
        + `<div class="ms">${esch(it.milestone)}${linkChips(it)}</div>`
        + (isEditor()? editCell : actionCell)
        + `</div>`;
    }).join('');
    const dow=isToday?`TODAY — ${fmtDOW(d).slice(0,3)}`:isTom?`TOMORROW — ${fmtDOW(d).slice(0,3)}`:fmtDOW(d);
    return `<section class="day"><div class="day-h ${isToday?'is-today':''}"><span class="dow">${dow}</span><span class="date">${fmtDate(d)}</span>${isToday?'<span class="todaytag">TODAY</span>':''}</div>${rows}</section>`;
  }).join('');
}
function sumCard(cls,ic,n,lbl){ const p=lbl.split(' '); return `<div class="sum ${cls}"><span class="ic">${ic}</span><div><div class="n">${n}</div><div class="lbl">${p[0]}<br>${p.slice(1).join(' ')}</div></div></div>`; }

function openDrawer(html){ const d=document.getElementById('drw'); d.innerHTML=html; document.getElementById('drwOv').classList.add('open'); d.classList.add('open'); }
function closeDrawer(){ document.getElementById('drwOv').classList.remove('open'); document.getElementById('drw').classList.remove('open'); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3400); }

// --- Fern: review → email the PMO (no login, no backend) ---
function openApprove(idx){
  CUR=idx; const it=ITEMS[idx]; if(!it) return;
  const L=itemLinks(it);
  openDrawer(`<button class="x" onclick="closeDrawer()">×</button>`
    + `<div class="d-eyebrow">Review</div><h3>${esch(it.game)}</h3>`
    + `<div class="d-sub"><b>${esch(it.boardLabel||it.board)}</b> · <a href="https://ponggamestudios.atlassian.net/browse/${esca(it.jira)}" target="_blank" rel="noopener" style="color:var(--play);text-decoration:none">${esch(it.jira)} ↗</a> · ${esch(it.milestone)}</div>`
    + ((L.review||L.play)?`<div class="d-openrow">`+(L.review?`<a class="d-open" href="${esca(L.review)}" target="_blank" rel="noopener">📄 Open review page</a>`:'')+(L.play?`<a class="d-open" href="${esca(L.play)}" target="_blank" rel="noopener">▶ Open game to test</a>`:'')+`</div>`:'')
    + `<label>Note (optional)</label><textarea id="apprNote" placeholder="Anything to pass to the PMO…"></textarea>`
    + `<div class="note-box">Approving opens an email to the <b>PMO</b> — just hit <b>Send</b>. The PMO records the sign-off and clears it from the board.</div>`
    + `<div class="d-foot"><span class="d-msg" id="dMsg"></span><button class="d-btn" onclick="closeDrawer()">Cancel</button><button class="d-btn primary" id="apprBtn">Approve → email PMO</button></div>`);
  document.getElementById('apprBtn').onclick = ()=>emailApproval(idx);
}
function emailApproval(idx){
  const it=ITEMS[idx]; if(!it) return;
  const note=document.getElementById('apprNote').value.trim();
  const msg=document.getElementById('dMsg'); msg.className='d-msg';
  const to = pmoEmail().split(',').map(s=>s.trim()).filter(Boolean);   // PMO may be several people
  if(!to.length){ msg.className='d-msg err'; msg.textContent='No PMO email set yet — ask your PMO to add it in Manage.'; return; }
  const L=itemLinks(it);
  const subject=`Approved: ${it.game} (${it.jira}) — ${it.milestone}`;
  const bodyLines=[`I've reviewed and approve:`,``,`Game: ${it.game} [${it.boardLabel||it.board}]  ${it.jira}`,`Milestone: ${it.milestone}`];
  if(L.review) bodyLines.push(`Review page: ${L.review}`);
  if(L.play)   bodyLines.push(`Play/test: ${L.play}`);
  if(note)     bodyLines.push(``,`Note: ${note}`);
  bodyLines.push(``,`— Sent from the PGS CEO Summary`);
  const href=`mailto:${to.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyLines.join('\n'))}`;
  window.location.href = href;                 // opens the viewer's mail client
  markSent(it.jira); closeDrawer(); render();
  toast('Email opened — hit Send to notify the PMO');
}

// --- PMO: manage list (add / reorder / remove / mark-approved) + tracking ---
function openEdit(){
  if(!isEditor()) return openSignIn();
  const list = ITEMS.map((it,i)=>`<div class="cur-item" draggable="true" data-i="${i}">`
      + `<span class="grip" title="Drag to reorder">⠿</span>`
      + `<span class="g">${esch(it.game)} <span class="d">${esch(it.jira)} · ${esch(it.date)} · ${esch(it.action)}</span></span>`
      + `<button class="pmo-appr" data-appr="${i}" title="Mark approved">✓</button>`
      + `<button class="rm" data-rm="${i}">✕</button></div>`).join('')
    || '<div class="d-sub" style="margin-top:6px">No games yet — add one below, or use “Send to CEO review” in the pipeline.</div>';
  const approved = APPROVED.length
    ? APPROVED.map((a,i)=>`<div class="appr-item"><span class="g">✓ ${esch(a.game)} <span class="d" style="color:var(--sub)">${esch(a.jira)}</span></span><span class="m">${esch(a.approved_by||'')}${a.approved_at?(' · '+fmtWhen(a.approved_at)):''}</span><button class="rm" data-apprm="${i}" title="Remove from history">✕</button></div>`).join('')
    : '<div class="d-sub" style="margin-top:6px">Nothing approved yet.</div>';
  openDrawer(`<button class="x" onclick="closeDrawer()">×</button>`
    + `<div class="d-eyebrow">PMO · manage review list</div><h3>Fern's review board</h3>`
    + `<label>PMO notify emails <span style="text-transform:none;font-weight:400;color:var(--sub)">(comma-separated — Fern only sees “PMO”)</span></label>`
    + `<input type="text" id="fPmo" placeholder="simon@…, mayank@…, pruthvi@…" value="${esca(REVIEW_CONFIG.pmo_email||'')}">`
    + `<label>Add a game</label><input type="text" id="srch" placeholder="Search name or IG-/V2- key…" autocomplete="off">`
    + `<div class="srch-res" id="srchRes" hidden></div>`
    + `<div id="addForm" hidden>`
      + `<label>Milestone</label><input type="text" id="fMs" placeholder="e.g. Final character art">`
      + `<label>Action</label><select id="fAct"><option value="review">🎨 Review &amp; approve</option><option value="play">🎮 Play &amp; review</option><option value="decision">🔴 Decision required</option></select>`
      + `<label>Date</label><input type="date" id="fDate">`
      + `<button class="d-btn primary" id="addBtn" style="margin-top:14px">Add to list</button>`
    + `</div>`
    + `<label style="margin-top:20px">Pending — drag to reorder (${ITEMS.length})</label><div class="cur-list" id="curList">${list}</div>`
    + `<label style="margin-top:20px">Approved (${APPROVED.length})</label><div>${approved}</div>`
    + `<div class="d-foot"><span class="d-msg" id="dMsg">Signed in as <b>${esch(getUser()||'editor')}</b></span><button class="d-btn" onclick="closeDrawer()">Close</button><button class="d-btn primary" id="saveBtn">Save</button></div>`);
  wireEdit();
}
function wireEdit(){
  const srch=document.getElementById('srch'), res=document.getElementById('srchRes'), form=document.getElementById('addForm');
  document.getElementById('fPmo').onchange = e=>{ REVIEW_CONFIG.pmo_email = e.target.value.trim(); };
  srch.oninput = ()=>{
    const q=srch.value.trim().toLowerCase();
    if(!q){ res.hidden=true; return; }
    const have=new Set(ITEMS.map(i=>i.jira));
    const hits=ALLGAMES.filter(g=>!have.has(g.jira) && (g.game+' '+g.jira).toLowerCase().includes(q)).slice(0,12);
    res.innerHTML=hits.map(g=>`<div class="r" data-jira="${esca(g.jira)}">${esch(g.game)}<span class="k">${esch(g.jira)} · ${g.boardLabel}</span></div>`).join('')||'<div class="r" style="color:var(--sub)">No matches</div>';
    res.hidden=false;
    res.querySelectorAll('.r[data-jira]').forEach(el=> el.onclick=()=>{
      PICKED=ALLGAMES.find(g=>g.jira===el.dataset.jira);
      srch.value=PICKED.game; res.hidden=true; form.hidden=false;
      const d=new Date(); document.getElementById('fDate').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    });
  };
  document.getElementById('addBtn').onclick=()=>{
    if(!PICKED) return;
    const ms=document.getElementById('fMs').value.trim(), act=document.getElementById('fAct').value, date=document.getElementById('fDate').value;
    if(!ms||!date){ const m=document.getElementById('dMsg'); m.className='d-msg err'; m.textContent='Milestone and date required.'; return; }
    ITEMS.push({ jira:PICKED.jira, game:PICKED.game, board:PICKED.board, boardLabel:PICKED.boardLabel, milestone:ms, action:act, date });
    PICKED=null; render(); openEdit();
  };
  document.getElementById('saveBtn').onclick=saveReview;
  document.querySelectorAll('#curList .rm[data-rm]').forEach(b=> b.onclick=()=>{ ITEMS.splice(+b.dataset.rm,1); render(); openEdit(); });
  document.querySelectorAll('#curList .pmo-appr[data-appr]').forEach(b=> b.onclick=()=> markApproved(+b.dataset.appr, true));
  document.querySelectorAll('.rm[data-apprm]').forEach(b=> b.onclick=()=>{ APPROVED.splice(+b.dataset.apprm,1); openEdit(); });
  document.querySelectorAll('#curList .cur-item').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ DRAG_FROM=+el.dataset.i; });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', e=>{ e.preventDefault(); el.classList.remove('drag-over');
      const to=+el.dataset.i; if(DRAG_FROM==null||DRAG_FROM===to) return;
      const [m]=ITEMS.splice(DRAG_FROM,1); ITEMS.splice(to,0,m); DRAG_FROM=null; render(); openEdit(); });
  });
}
async function persistReview(){
  const payload={ items:ITEMS, approved:APPROVED, config:{ pmo_email:(REVIEW_CONFIG.pmo_email||'') }, updated_by:getUser()||'editor', updated_at:new Date().toISOString().slice(0,16).replace('T',' ') };
  let sha=null; try{ const g=await ghFetch(`${GH_API}/contents/${REVIEW_PATH}`); sha=g.sha; }catch(e){}
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2))));
  const body={ message:`ceo-review: update by ${payload.updated_by}`, content, branch:'main' };
  if(sha) body.sha=sha;
  await ghFetch(`${GH_API}/contents/${REVIEW_PATH}`, { method:'PUT', body:JSON.stringify(body) });
}
// PMO marks an item approved → it clears off the board into the Approved history.
async function markApproved(idx, fromDrawer){
  const it=ITEMS[idx]; if(!it) return;
  APPROVED.unshift(Object.assign({}, it, { approved_by:getUser()||'PMO', approved_at:new Date().toISOString() }));
  ITEMS.splice(idx,1); render();
  if(fromDrawer){ openEdit(); return; }   // in the drawer, Save persists
  try{ await persistReview(); toast('Approved ✓'); }catch(e){ toast('Approved locally — save failed: '+(e.message||e)); }
}
async function saveReview(){
  const msg=document.getElementById('dMsg'); msg.className='d-msg'; msg.textContent='Saving…';
  const pmo=(document.getElementById('fPmo')?document.getElementById('fPmo').value.trim():REVIEW_CONFIG.pmo_email)||'';
  REVIEW_CONFIG.pmo_email=pmo;
  try{ await persistReview(); closeDrawer(); render(); toast('Review list saved ✓'); }
  catch(e){ msg.className='d-msg err'; msg.textContent=String(e.message||e); }
}

// --- PMO sign-in (editor token, shared with pipeline) ---
function openSignIn(){
  openDrawer(`<button class="x" onclick="closeDrawer()">×</button>`
    + `<div class="d-eyebrow">PMO sign-in</div><h3>Sign in to manage the list</h3>`
    + `<div class="d-sub">Paste your team token (fine-grained GitHub PAT, Contents: Read &amp; write). Stored on this browser only. Fern doesn't need this — he only reviews &amp; approves.</div>`
    + `<label>Team token</label><textarea id="patIn" placeholder="github_pat_…" spellcheck="false"></textarea>`
    + `<div class="d-foot"><span class="d-msg" id="dMsg"></span><button class="d-btn" onclick="closeDrawer()">Cancel</button><button class="d-btn primary" id="patBtn">Verify</button></div>`);
  document.getElementById('patBtn').onclick = async ()=>{
    const tok=document.getElementById('patIn').value.trim(), msg=document.getElementById('dMsg'); msg.className='d-msg';
    if(!tok){ msg.textContent='Enter a token.'; return; }
    msg.textContent='Verifying…';
    try{ localStorage.setItem(GH_PAT_KEY,tok); }catch(e){}
    try{
      const u=await ghFetch('https://api.github.com/user'); const repo=await ghFetch(GH_API);
      if(!repo.permissions||!repo.permissions.push) throw new Error(`${u.login} can't write — ask an admin.`);
      try{ localStorage.setItem(GH_USER_KEY,u.login); }catch(e){}
      renderWhoami(); render(); openEdit();
    }catch(e){ try{localStorage.removeItem(GH_PAT_KEY);}catch(x){} msg.className='d-msg err'; msg.textContent=String(e.message||e); }
  };
}
function pmoEntry(){ isEditor()?openEdit():openSignIn(); }
function renderWhoami(){
  // "Manage list" is always visible; clicking it signs the PMO in if needed.
  const el=document.getElementById('whoami');
  el.innerHTML = isEditor()
    ? `PMO: <b>${esch(getUser()||'editor')}</b> · <a onclick="signOut()">sign out</a>`
    : `Creative Director view · <a onclick="pmoEntry()">PMO manage</a>`;
}
function signOut(){ try{ localStorage.removeItem(GH_PAT_KEY); localStorage.removeItem(GH_USER_KEY); }catch(e){} renderWhoami(); render(); }

async function init(){
  document.getElementById('todayLine').textContent = TODAY.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  loadAllGames();
  await loadReview();
  renderWhoami();
  document.querySelectorAll('.btn[data-view]').forEach(b=> b.onclick=()=>{ VIEW=b.dataset.view; document.querySelectorAll('.btn[data-view]').forEach(x=>x.classList.toggle('active',x===b)); render(); });
  document.getElementById('editBtn').onclick = pmoEntry;   // sign in if needed, then manage
  document.getElementById('drwOv').addEventListener('click', closeDrawer);
  document.getElementById('calendar').addEventListener('click', e=>{
    const ap=e.target.closest('.pmo-appr[data-appr]'); if(ap){ markApproved(+ap.dataset.appr, false); return; }
    const a=e.target.closest('.action[data-idx]'); if(a){ openApprove(+a.dataset.idx); }
  });
  render();
}
init();
</script>
