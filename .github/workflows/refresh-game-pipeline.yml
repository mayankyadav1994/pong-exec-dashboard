# ============================================================
# Refresh Game Pipeline Dashboard
# Lives in the pong-exec-dashboard repo at
#   .github/workflows/refresh-game-pipeline.yml
# Source lives under the repo's "game-pipeline/" subfolder (Decision #28).
#
# Reuses the exec-dashboard secrets already configured in this repo:
#   JIRA_EMAIL, JIRA_API_TOKEN
# JIRA_BASE_URL + board IDs are NOT secret, so they're plain values below.
# ============================================================
name: Refresh Game Pipeline Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  push:
    # Auto-promote subfolder edits to the served root copies. Without this,
    # edits to game-pipeline/dashboard.js (forecast logic, HTML cache-buster
    # bumps, etc.) sit in the subfolder until the next 6am UTC refresh — the
    # root copies (what Pages actually serves) stay stale and viewers see
    # old behaviour.
    branches: [main]
    paths:
      - 'game-pipeline/dashboard.js'
      - 'game-pipeline/dashboard.css'
      - 'game-pipeline/game-pipeline.html'
      - 'game-pipeline/build_jira_data.py'

# Serialize against the other dashboard refreshes — the v2/iGaming timeline
# workflows use this same group — so their commits to main can't land mid-build
# and reject this job's push (#72).
concurrency:
  group: refresh-dashboards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history so the rebase-safe push below can rebase
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r game-pipeline/requirements.txt
      - run: python game-pipeline/build_jira_data.py --project both
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: https://ponggamestudios.atlassian.net
          JIRA_BOARD_ID_V2: '316'   # V2 Scrum board (axis only; V2 issues are Kanban/no sprints)
          JIRA_BOARD_ID_IG: '250'   # iGaming board
      - run: |
          cp game-pipeline/game-pipeline.html .
          cp game-pipeline/dashboard.js .
          cp game-pipeline/dashboard.css .
          cp game-pipeline/dashboard-data-v2.js .
          cp game-pipeline/dashboard-data-ig.js .
          cp game-pipeline/dashboard-data-igf.js .
      - name: Commit & push refreshed data (rebase-safe)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Refresh game pipeline data"
          # The ~5-min Jira build can be lapped by other pushes to main; rebase and
          # retry instead of dying on a non-fast-forward push (the reported bug). (#72)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push rejected (main moved) — fetch + rebase, attempt $i/5"
            git fetch origin main && git rebase origin/main || { git rebase --abort || true; }
          done
          echo "::error::push failed after 5 rebase attempts"; exit 1
