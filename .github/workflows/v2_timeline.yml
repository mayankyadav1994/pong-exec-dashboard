name: V2 Timeline

on:
  schedule:
    # 06:15 UTC, 15 minutes after exec dashboard. See exec_dashboard.yml for
    # the reasoning behind the early UTC time — GitHub schedule delays are
    # absorbed into the night so the dashboards are ready by morning.
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    # Rebuild immediately when the editable config changes via the
    # "Save as default" panel button — ~2-3 min from save-click to deployed HTML.
    # Also rebuild when the template HTML or the builder script changes so
    # manual edits to those files don't need a separate workflow_dispatch.
    branches: [main]
    paths:
      - "config/v2.json"
      - "v2-timeline.template.html"
      - "v2_timeline.py"

# Serialize against exec_dashboard so the two pushes can't race.
concurrency:
  group: refresh-dashboards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build V2 timeline
        env:
          JIRA_EMAIL:           ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:       ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python v2_timeline.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage and commit the regenerated HTML first so the working tree is
          # clean before we touch the remote. If the build produced no diff,
          # exit cleanly without pulling/pushing.
          git add v2-timeline.html
          if git diff --staged --quiet; then
            echo "No V2 timeline changes to commit."
            exit 0
          fi
          git commit -m "chore: v2 timeline refresh $(date -u +%Y-%m-%d)"
          # Pull any concurrent commits (e.g. the Exec Dashboard workflow ran
          # between our checkout and this push). --autostash safeguards any
          # other unstaged modifications a future build step might introduce.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
