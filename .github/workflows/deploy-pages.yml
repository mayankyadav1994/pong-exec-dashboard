# ============================================================
# Deploy GitHub Pages (Actions-based, serialized)
# Replaces the built-in "deploy from branch" deploy, which was spawning
# overlapping deployments that collided and failed with "Timeout reached,
# aborting!" (multiple failures 2026-06-24/25, 07-02). A single concurrency
# group serializes deploys so bursts of commits (the 5 daily refresh workflows
# + team-board/game-pipeline + plan saves) never overlap.
#
# ONE-TIME SETUP: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions" (instead of "Deploy from a branch"). Until that's set this
# workflow's deploy step will fail and the old branch deploy keeps running.
# ============================================================
name: Deploy Pages
on:
  # Human / PAT commits (e.g. the "Save as default" plan saves) trigger this.
  push:
    branches: [main]
  # The daily refresh workflows commit with GITHUB_TOKEN, whose pushes do NOT
  # trigger other workflows (GitHub's recursion guard). So re-run the deploy
  # after each refresh completes — otherwise the site would stop updating daily.
  workflow_run:
    workflows:
      - "Exec Dashboard"
      - "V2 Timeline"
      - "iGaming Timeline"
      - "Refresh Team Board Data"
      - "Refresh Game Pipeline Dashboard"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys. The morning bursts (5 refresh workflows, 3 of them at
# 06:00 UTC) push several commits within minutes.
#
# cancel-in-progress:true was CANCELLING a Deploy Pages run mid-flight, which
# left the Pages-backend deployment it had already registered stuck "in
# progress" — so the next run's deploy-pages step was rejected with
# "Deployment request failed … due to in progress deployment. Please cancel X
# first or wait" (two failure emails 2026-09-10). Use false, GitHub's
# recommended Pages setting: let an in-progress deploy COMPLETE and collapse
# only the PENDING queue to the latest commit (which, on a linear main, already
# contains every refresh). Serialized, never cancelled mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # For refresh-triggered runs, only deploy if the refresh actually succeeded.
    # push / manual runs always deploy.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
