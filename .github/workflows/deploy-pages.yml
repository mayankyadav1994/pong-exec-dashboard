# ============================================================
# Deploy GitHub Pages (Actions-based, serialized)
# Replaces the built-in "deploy from branch" deploy, which was spawning
# overlapping deployments that collided and failed with "Timeout reached,
# aborting!" (multiple failures 2026-06-24/25, 07-02). A single concurrency
# group serializes deploys so bursts of commits (the 5 daily refresh workflows
# + team-board/game-pipeline + plan saves) never overlap.
#
# ONE-TIME SETUP: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions" (instead of "Deploy from a branch"). Until that's set this
# workflow's deploy step will fail and the old branch deploy keeps running.
# ============================================================
name: Deploy Pages
on:
  # Every commit to main deploys: human commits, "Save as default" plan saves,
  # AND the daily refresh commits — the refresh workflows push with PUSH_PAT
  # (since 86355b9), which, unlike GITHUB_TOKEN, does trigger push workflows.
  # A workflow_run trigger on the refresh workflows used to sit here for the
  # GITHUB_TOKEN era; once they switched to PUSH_PAT it deployed every refresh
  # commit twice, doubling the runs and the failure emails (removed 2026-11-25).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys. The morning bursts (5 refresh workflows, 3 of them at
# 06:00 UTC) push several commits within minutes.
#
# cancel-in-progress:true was CANCELLING a Deploy Pages run mid-flight, which
# left the Pages-backend deployment it had already registered stuck "in
# progress" — so the next run's deploy-pages step was rejected with
# "Deployment request failed … due to in progress deployment. Please cancel X
# first or wait" (two failure emails 2026-09-10). Use false, GitHub's
# recommended Pages setting: let an in-progress deploy COMPLETE and collapse
# only the PENDING queue to the latest commit (which, on a linear main, already
# contains every refresh). Serialized, never cancelled mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # deploy-pages sometimes can't see the artifact uploaded seconds earlier
      # ("No artifacts named github-pages were found" / "Found 0 artifact(s)")
      # — about 1 run in 3 in Nov 2026. It fails while fetching artifact
      # metadata, before any Pages deployment is registered, so waiting and
      # trying once more is safe. Only a second failure fails the job.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for the artifact to become visible
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
