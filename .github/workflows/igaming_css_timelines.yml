name: iGaming + CSS Timelines

# Both pages come from one engine (timelines/timeline.py + timeline.template.html),
# so they rebuild together in one run: same logic, one slot in the
# refresh-dashboards queue (it holds only one pending run).

on:
  schedule:
    # 06:30 UTC, 15 minutes after V2 timeline (which runs at 06:15) and
    # 30 minutes after the exec dashboard (06:00). The workflows share
    # the same concurrency group so commits serialize cleanly. See
    # v2_timeline.yml and exec_dashboard.yml for the reasoning behind the
    # early UTC time window.
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    # Rebuild immediately when an editable config changes via the
    # "Save as default" panel button (~2-3 min round-trip from save-click to
    # deployed HTML), or when the engine or its template changes.
    branches: [main]
    paths:
      - "config/igaming.json"
      - "config/css.json"
      - "timelines/timeline.template.html"
      - "timelines/timeline.py"

concurrency:
  group: refresh-dashboards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push identity = @mayankyadav1994 (bypass actor on the main-branch
          # ruleset). See v2_timeline.yml for the full rationale.
          token: ${{ secrets.PUSH_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Sprint axes come from each project's Scrum board. If a board query
      # fails the engine falls back to the anchored 14-day cadence, so the
      # axis renders either way.
      - name: Build iGaming timeline
        env:
          JIRA_EMAIL:           ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:       ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          JIRA_BOARD_ID_IG:     '250'
        run: python timelines/timeline.py igaming

      - name: Build Cloud Services timeline
        env:
          JIRA_EMAIL:           ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:       ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          JIRA_BOARD_ID_CSS:    '217'
        run: python timelines/timeline.py css

      # Smoke-test the rendered HTML before commit: loads it via jsdom,
      # asserts rows render, clicks Edit Plan + What-If, fails the run if
      # any uncaught JS error fires.
      - name: Set up Node for smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke-test both timelines
        run: |
          npm install --no-save --silent jsdom
          node tools/smoke-test.js timelines/igaming-timeline.html timelines/css-timeline.html

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage and commit the regenerated HTML first so the working tree is
          # clean before we touch the remote. If the build produced no diff,
          # exit cleanly without pulling/pushing.
          git add timelines/igaming-timeline.html timelines/snapshots/igaming/ timelines/snapshots/igaming-scope-baseline.json \
                  timelines/css-timeline.html timelines/snapshots/css/ timelines/snapshots/css-scope-baseline.json || true
          if git diff --staged --quiet; then
            echo "No timeline changes to commit."
            exit 0
          fi
          git commit -m "chore: igaming + css timeline refresh $(date -u +%Y-%m-%d)"
          # Pull any concurrent commits (e.g. the V2 Timeline workflow ran
          # between our checkout and this push). --autostash safeguards any
          # other unstaged modifications a future build step might introduce.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
