name: People

on:
  schedule:
    # 07:15 UTC — after the Game Pipeline (06:00, its velocity forecast feeds the
    # plan) and the Roadmap (06:45, its cards label each project). Shares their
    # concurrency group so the commits serialize cleanly.
    - cron: "15 7 * * *"
  workflow_dispatch:
  push:
    # Rebuild straight away when the builder, template or nav config change.
    branches: [main]
    paths:
      - "people/people.py"
      - "people/people.template.html"
      - "config/roadmap.json"

concurrency:
  group: refresh-dashboards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push identity = @mayankyadav1994 (bypass actor on the main-branch
          # ruleset). See v2_timeline.yml for the full rationale.
          token: ${{ secrets.PUSH_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reads Tempo (worklogs) + Jira (open work), and the committed Game
      # Pipeline data, plan files, Roadmap pages and Sprint Load snapshot.
      - name: Build People page
        env:
          JIRA_EMAIL:      ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:  ${{ secrets.JIRA_API_TOKEN }}
          TEMPO_API_TOKEN: ${{ secrets.TEMPO_API_TOKEN }}
        run: python people/people.py

      # Fails the run (before commit) on any uncaught JS error, too few people,
      # or broken view / expand / tray / filter / zoom controls.
      - name: Set up Node for smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke-test People page
        run: |
          npm install --no-save --silent jsdom
          node tools/smoke-people.js people/people.html

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add people/people.html || true
          if git diff --staged --quiet; then
            echo "No People changes to commit."
            exit 0
          fi
          git commit -m "chore: people refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
