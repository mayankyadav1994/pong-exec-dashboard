<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Board — Pong Game Studios</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F9FAFB; padding: 1.25rem; color:#111827; }
.db { max-width: 1320px; margin: 0 auto; }

.db-header { background: linear-gradient(135deg, #0F766E 0%, #0891B2 55%, #4F46E5 100%); border-radius: 14px; padding: 18px 22px 16px; margin-bottom: 14px; }
.db-header h1 { font-size: 19px; font-weight: 600; color: #fff; margin-bottom: 3px; }
.db-header p { font-size: 12px; color: rgba(255,255,255,0.82); }

/* shared site tabs (same markup as the other pages) */
.site-tabs { max-width: 1320px; margin: 0 auto 14px; padding: 0 4px; }
.site-tabs-inner { display: flex; gap: 4px; border-bottom: 1px solid #E5E7EB; }
.site-tab { padding: 9px 16px; font-size: 13px; font-weight: 500; color: #6B7280; text-decoration: none; border-bottom: 2px solid transparent; }
.site-tab:hover { color: #111827; }
.site-tab.active { color: #0891B2; border-bottom-color: #0891B2; font-weight: 600; }

.bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.depttabs { display:flex; gap:4px; }
.dtab { padding:7px 14px; font-size:13px; font-weight:600; color:#6B7280; background:#fff; border:1px solid #E5E7EB; border-radius:8px; cursor:pointer; }
.dtab.active { color:#fff; background:#0891B2; border-color:#0891B2; }
.spinfo { font-size:12px; color:#374151; background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:7px 10px; }
.spacer { flex:1; }
.btn { font-size:12px; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid #E5E7EB; background:#fff; color:#374151; cursor:pointer; }
.btn-primary { background:#4F46E5; color:#fff; border-color:#4F46E5; }
.legend { font-size:11px; color:#6B7280; display:flex; gap:12px; align-items:center; }
.legend .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

.workspace { display:grid; grid-template-columns: 250px 1fr; gap:12px; align-items:start; }
.panel { background:#fff; border:1px solid #E5E7EB; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
.panel-head { padding:10px 14px; border-bottom:1px solid #EEF0F3; font-size:12px; font-weight:700; color:#374151; display:flex; justify-content:space-between; align-items:center; background:#F8FAFC; border-radius:12px 12px 0 0; }
.panel-head .ct { font-size:11px; background:rgba(0,0,0,0.07); color:#333; padding:1px 8px; border-radius:20px; }
.backlog-body { padding:10px; min-height:220px; max-height:78vh; overflow:auto; display:flex; flex-direction:column; gap:7px; }
.drop-hot { background:#ECFEFF !important; outline:2px dashed #67E8F9; outline-offset:-4px; }

.cal { padding:10px; }
.week-lbl { font-size:10px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.06em; margin:4px 2px 6px; }
.week { display:grid; grid-template-columns: repeat(7, 1fr); gap:7px; margin-bottom:12px; }
.day { border:1px solid #EEF0F3; border-radius:10px; min-height:150px; display:flex; flex-direction:column; background:#FCFCFD; }
.day.weekend { background:#F3F4F6; opacity:.65; }
.day.today { border-color:#0891B2; box-shadow:0 0 0 2px rgba(8,145,178,.18); }
.day.empty { visibility:hidden; }
.day-head { padding:6px 9px 5px; border-bottom:1px solid #F0F2F4; display:flex; justify-content:space-between; align-items:baseline; }
.day-date { font-size:11px; font-weight:700; color:#374151; }
.day-dow { font-size:9px; color:#9CA3AF; text-transform:uppercase; letter-spacing:.05em; }
.cap { font-size:10px; font-weight:700; font-variant-numeric:tabular-nums; padding:1px 6px; border-radius:10px; }
.cap.ok { background:#D1FAE5; color:#065F46; } .cap.warn { background:#FEF3C7; color:#92400E; } .cap.over { background:#FEE2E2; color:#B91C1C; }
.day-body { flex:1; padding:6px; display:flex; flex-direction:column; gap:6px; overflow:auto; max-height:46vh; }

.pill { border:1px solid #E5E7EB; border-left-width:4px; border-radius:8px; background:#fff; padding:6px 8px; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.05); user-select:none; }
.pill:active { cursor:grabbing; } .pill.dragging { opacity:.4; }
.pill.math { border-left-color:#10B981; } .pill.art { border-left-color:#F59E0B; }
.pill.locked { cursor:not-allowed; opacity:.85; border-left-style:dashed; }
.pill-top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.pill-key { font-family:'SFMono-Regular',Consolas,monospace; font-size:10px; font-weight:700; color:#0891B2; text-decoration:none; }
.pill-key:hover { text-decoration:underline; }
.pill-hrs { font-size:10px; font-weight:700; color:#6B7280; font-variant-numeric:tabular-nums; }
.pill-sum { font-size:11px; color:#111827; line-height:1.25; margin:3px 0 4px; }
.pill-bot { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.pill-meta { display:flex; align-items:center; gap:5px; min-width:0; }
.avatar { width:17px; height:17px; border-radius:50%; background:#0891B2; color:#fff; font-size:8px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.avatar.none { background:#E5E7EB; color:#9CA3AF; }
.who { font-size:10px; color:#6B7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
.b-wip{background:#3B82F6;} .b-qa{background:#10B981;} .b-todo{background:#9CA3AF;} .b-hold{background:#F59E0B;} .b-done{background:#34D399;}
.stat { display:inline-flex; align-items:center; gap:4px; font-size:9px; font-weight:700; padding:1px 7px; border-radius:10px; white-space:nowrap; }
.stat .dot { width:6px; height:6px; }
.st-todo{ background:#F3F4F6; color:#4B5563; } .st-wip{ background:#DBEAFE; color:#1D4ED8; }
.st-qa{ background:#D1FAE5; color:#065F46; } .st-hold{ background:#FEF3C7; color:#92400E; } .st-done{ background:#DCFCE7; color:#166534; }
.rem { font-size:10px; font-weight:700; font-variant-numeric:tabular-nums; }
.rem.has { color:#1D4ED8; } .rem.none { color:#9CA3AF; }
.pill-foot { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:6px; padding-top:5px; border-top:1px dashed #EEF0F3; }
.sub-toggle { font-size:9px; font-weight:700; color:#0891B2; background:#ECFEFF; border:1px solid #BAE6FD; border-radius:7px; padding:2px 7px; cursor:pointer; }
.sub-toggle:hover { background:#CFFAFE; }
.sub-none { font-size:9px; color:#B6BCC6; }
.due-edit-wrap { font-size:9px; display:inline-flex; align-items:center; gap:3px; color:#6B7280; }
.due-edit { font-size:9px; border:1px solid #E5E7EB; border-radius:6px; padding:2px 4px; font-family:inherit; color:#374151; }
.sub-panel { margin-top:6px; display:flex; flex-direction:column; gap:4px; border-top:1px solid #F0F2F4; padding-top:6px; }
.sub-row { display:grid; grid-template-columns:auto 1fr auto auto; gap:6px; align-items:center; font-size:9px; cursor:grab; padding:2px 3px; border-radius:5px; }
.sub-row:hover { background:#F3F4F6; }
.sub-row.dragging { opacity:.4; }
.sub-key { font-family:'SFMono-Regular',Consolas,monospace; font-weight:700; color:#0891B2; text-decoration:none; }
.sub-key:hover { text-decoration:underline; }
.sub-sum { color:#374151; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sub-rem { font-variant-numeric:tabular-nums; color:#6B7280; font-weight:600; }
.sub-row .stat { font-size:8px; padding:0 5px; }
.game { font-size:9px; color:#9CA3AF; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.flag { font-size:9px; font-weight:700; padding:0 5px; border-radius:8px; white-space:nowrap; }
.f-blocked { background:#FEE2E2; color:#B91C1C; } .f-unestimated { background:#FEF3C7; color:#92400E; } .f-unassigned{ background:#F3F4F6; color:#6B7280; }

/* compact subtask chip on the calendar / backlog */
.sub-chip { display:flex; align-items:center; gap:5px; border:1px solid #E5E7EB; border-left:3px solid #94A3B8; border-radius:6px; background:#fff; padding:3px 6px; cursor:grab; font-size:10px; box-shadow:0 1px 1px rgba(0,0,0,.04); }
.sub-chip.dragging { opacity:.4; }
.sub-chip.math { border-left-color:#10B981; } .sub-chip.art { border-left-color:#F59E0B; }
.chip-key { font-family:'SFMono-Regular',Consolas,monospace; font-size:9px; font-weight:700; color:#0891B2; text-decoration:none; flex-shrink:0; }
.chip-key:hover { text-decoration:underline; }
.chip-sum { color:#374151; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.chip-rem { font-size:9px; font-weight:700; color:#6B7280; font-variant-numeric:tabular-nums; flex-shrink:0; }

/* calendar controls bar */
.calbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.viewsw { display:inline-flex; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden; }
.viewsw button { font-size:12px; font-weight:600; padding:7px 14px; border:none; background:#fff; color:#6B7280; cursor:pointer; border-right:1px solid #E5E7EB; }
.viewsw button:last-child { border-right:none; }
.viewsw button.active { background:#0891B2; color:#fff; }
.navgrp { display:inline-flex; gap:4px; align-items:center; }
.navgrp button { font-size:12px; font-weight:600; padding:7px 11px; border:1px solid #E5E7EB; background:#fff; color:#374151; border-radius:8px; cursor:pointer; }
.navgrp button:hover { background:#F3F4F6; }
#navSprint { color:#0891B2; border-color:#BAE6FD; background:#ECFEFF; }
.range-label { font-size:14px; font-weight:700; color:#111827; }

/* day-of-week header + month/day layout */
.dow-head { margin-bottom:6px; }
.dowh { font-size:10px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.05em; text-align:center; padding:2px 0; }
.cal-day-single .day-big { min-height:420px; }
.cal-day-single .day-big .day-body { max-height:64vh; }
.day.in-sprint { background:#F0FDFA; border-color:#99F6E4; }
.day.in-sprint.weekend { background:#ECFDF5; }
.sp-marker-row { padding:0 8px 4px; }
.sp-marker { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:8px; }
.sp-marker.start { background:#CCFBF1; color:#0F766E; }
.sp-marker.end { background:#FEE2E2; color:#B91C1C; }

.scrim { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; z-index:40; }
.scrim.open { display:block; }
.drawer { position:fixed; top:0; right:0; height:100%; width:440px; max-width:94vw; background:#fff; box-shadow:-8px 0 28px rgba(0,0,0,.18); transform:translateX(100%); transition:transform .2s; z-index:50; display:flex; flex-direction:column; }
.drawer.open { transform:none; }
.drawer-head { padding:16px 18px; border-bottom:1px solid #EEF0F3; }
.drawer-head h2 { font-size:15px; font-weight:700; } .drawer-head p { font-size:11px; color:#6B7280; margin-top:2px; }
.drawer-body { flex:1; overflow:auto; padding:12px 16px; }
.ep-sec { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#9CA3AF; margin:12px 2px 7px; }
.ep-row { display:flex; align-items:center; gap:9px; padding:8px 9px; border:1px solid #EEF0F3; border-radius:9px; margin-bottom:6px; }
.ep-row .k { font-family:'SFMono-Regular',Consolas,monospace; font-size:10px; font-weight:700; color:#0891B2; }
.ep-row .s { font-size:11px; flex:1; } .ep-row.in { background:#F0FDF4; border-color:#BBF7D0; }
.ep-row .toggle { font-size:11px; font-weight:700; padding:3px 10px; border-radius:7px; border:none; cursor:pointer; }
.toggle.add { background:#DBEAFE; color:#1D4ED8; } .toggle.rm { background:#FEE2E2; color:#B91C1C; }
.ep-search { width:100%; font-size:12px; padding:8px 10px; border:1px solid #E5E7EB; border-radius:8px; margin-bottom:6px; }
.drawer-foot { padding:12px 16px; border-top:1px solid #EEF0F3; display:flex; gap:8px; }

.toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; font-size:12px; padding:10px 16px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; }
.toast.show { opacity:1; }
.footer { font-size:10px; color:#9CA3AF; margin:10px 2px 0; }

/* ===== board layout: collapsible list + calendar ===== */
.board { display:grid; grid-template-columns:340px 1fr; gap:12px; align-items:start; transition:grid-template-columns .2s; }
.board.collapsed { grid-template-columns:38px 1fr; }
.panel-left { overflow:hidden; }
.lp-head { display:flex; align-items:center; gap:8px; padding:11px 12px; border-bottom:1px solid #EEF0F3; background:#F8FAFC; }
.lp-title { font-size:13px; font-weight:700; flex:1; }
.lp-count { font-size:11px; background:rgba(0,0,0,.07); color:#333; padding:1px 8px; border-radius:20px; font-weight:600; }
.lp-collapse, .lp-railbtn .ex { border:none; background:#ECFEFF; color:#0891B2; font-weight:700; border-radius:7px; width:24px; height:24px; cursor:pointer; }
.lp-sortrow { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid #F0F2F4; }
.lp-sort { font-size:11px; border:1px solid #E5E7EB; border-radius:7px; padding:5px 8px; color:#374151; background:#fff; flex:1; }
.lp-body { max-height:74vh; overflow:auto; padding:8px; display:flex; flex-direction:column; gap:7px; }
.lp-body.drop-hot { background:#FEF2F2; outline:2px dashed #FECACA; outline-offset:-4px; }
.lp-empty { font-size:11px; color:#9CA3AF; padding:10px; }
.lp-railbtn { display:none; }
.board.collapsed .lp-head, .board.collapsed .lp-sortrow, .board.collapsed .lp-body { display:none; }
.board.collapsed .lp-railbtn { display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 0; }
.lp-railbtn .vlabel { writing-mode:vertical-rl; font-size:10px; font-weight:700; color:#6B7280; letter-spacing:.08em; text-transform:uppercase; }

.li { border:1px solid #E5E7EB; border-left:4px solid #94A3B8; border-radius:9px; padding:8px 10px; cursor:grab; }
.li.dragging { opacity:.4; }
.li.math { border-left-color:#10B981; } .li.art { border-left-color:#F59E0B; }
.li.sub { margin-left:14px; border-left-style:dotted; background:#FCFCFD; }
.li-top { display:flex; align-items:center; gap:7px; }
.li-key { font-family:'SFMono-Regular',Consolas,monospace; font-size:11px; font-weight:700; color:#0891B2; text-decoration:none; }
.li-key:hover { text-decoration:underline; }
.li-hrs { margin-left:auto; font-size:10px; font-weight:700; color:#1D4ED8; font-variant-numeric:tabular-nums; }
.li-sum { font-size:12px; color:#111827; line-height:1.3; margin:4px 0 5px; }
.li-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dates { font-size:10px; font-weight:600; color:#0F766E; background:#F0FDFA; border:1px solid #99F6E4; border-radius:6px; padding:1px 7px; white-space:nowrap; }
.dates.none { color:#9CA3AF; background:#F9FAFB; border-color:#E5E7EB; }
.dates .arrow { color:#5EEAD4; margin:0 3px; } .dates .d1 { color:#9CA3AF; }

/* ===== calendar: day headers + span bars ===== */
.cal { padding:10px 12px 14px; }
.wk-head, .wk-bg, .wk-lanes { display:grid; grid-template-columns:repeat(7,1fr); }
.dow-head { margin-bottom:4px; } .dowh { font-size:10px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.05em; text-align:center; }
.wkrow { margin-bottom:10px; }
.wk-head { margin-bottom:4px; }
.dcell { text-align:center; padding:4px 0 5px; border-radius:8px 8px 0 0; position:relative; }
.dcell.blank { visibility:hidden; }
.dcell.sprint { background:#F0FDFA; } .dcell.wknd .dn { color:#C0C6CF; }
.dcell.today { box-shadow:inset 0 -2px 0 #0891B2; }
.dcell .dn { font-size:13px; font-weight:700; } .dcell .dw { font-size:9px; color:#9CA3AF; text-transform:uppercase; }
.dcell .cap { display:block; font-size:9px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; border-radius:8px; padding:0 4px; }
.cap.ok { color:#065F46; } .cap.warn { color:#92400E; } .cap.over { background:#FEE2E2; color:#B91C1C; }
.sp-start { display:inline-block; font-size:8px; font-weight:800; text-transform:uppercase; background:#CCFBF1; color:#0F766E; border-radius:7px; padding:1px 5px; }
.sp-end { display:inline-block; font-size:8px; font-weight:800; text-transform:uppercase; background:#FEE2E2; color:#B91C1C; border-radius:7px; padding:1px 5px; }

.lanes-wrap { position:relative; }
.wk-bg { position:absolute; inset:0; z-index:0; } .wk-bg>div { border-left:1px solid #F0F2F4; } .wk-bg>div.sprint { background:#F7FEFC; }
.wk-lanes { position:relative; z-index:1; grid-auto-rows:30px; row-gap:4px; padding-top:3px; }

.tbar { position:relative; display:flex; align-items:center; gap:5px; height:27px; padding:0 8px; border-radius:8px; font-size:11px; overflow:hidden; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.08); border:1px solid rgba(0,0,0,.06); }
.tbar.dragging { opacity:.4; }
.tbar.math { background:#ECFDF5; border-color:#A7F3D0; } .tbar.math .key { color:#047857; }
.tbar.art { background:#FFFBEB; border-color:#FDE68A; } .tbar.art .key { color:#B45309; }
.tbar .key { font-family:'SFMono-Regular',Consolas,monospace; font-size:10px; font-weight:700; text-decoration:none; flex-shrink:0; }
.tbar .key:hover { text-decoration:underline; }
.tbar .sum { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; color:#374151; }
.tbar .hrs { font-size:10px; font-weight:700; opacity:.7; flex-shrink:0; }
.tbar.cont-l { border-top-left-radius:0; border-bottom-left-radius:0; }
.tbar.cont-r { border-top-right-radius:0; border-bottom-right-radius:0; }
.tbar.cont-l::before { content:"◂"; position:absolute; left:2px; font-size:11px; opacity:.55; }
.tbar.cont-r::after { content:"▸"; position:absolute; right:2px; font-size:11px; opacity:.55; }
.grip { position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:2; }
.grip.l { left:0; } .grip.r { right:0; }
.grip::after { content:""; position:absolute; top:50%; transform:translateY(-50%); width:3px; height:13px; border-radius:2px; background:rgba(0,0,0,.2); }
.grip.l::after { left:2px; } .grip.r::after { right:2px; }

/* day view */
.dv-head { display:flex; align-items:center; gap:10px; padding:6px 4px 10px; border-bottom:1px solid #EEF0F3; margin-bottom:8px; }
.dv-date { font-size:15px; font-weight:700; }
.dv-head .cap { font-size:11px; margin-left:auto; padding:2px 8px; border-radius:8px; }
.dv-body { display:flex; flex-direction:column; gap:6px; max-height:64vh; overflow:auto; }
.dbar { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px; font-size:12px; cursor:grab; border:1px solid #E5E7EB; border-left:4px solid #94A3B8; }
.dbar.dragging { opacity:.4; }
.dbar.math { border-left-color:#10B981; } .dbar.art { border-left-color:#F59E0B; }
.dbar .key { font-family:'SFMono-Regular',Consolas,monospace; font-size:11px; font-weight:700; color:#0891B2; text-decoration:none; }
.dbar .sum { flex:1; color:#111827; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dbar .hrs { font-size:10px; font-weight:700; color:#6B7280; } .dbar .drange { font-size:10px; color:#0F766E; }
</style>
</head>
<body>
<!-- Standalone page at its own URL (team-board.html). Intentionally NOT linked
     into the exec/timeline dashboard nav — its only tabs are Math / Art below. -->
<div class="db">
  <div class="db-header">
    <h1>🧭 Team Board — Sprint Planning Calendar</h1>
    <p id="subhead">Loading…</p>
  </div>

  <div class="bar">
    <div class="depttabs" id="depttabs"></div>
    <span class="spinfo" id="spinfo"></span>
    <div class="spacer"></div>
    <div class="legend">
      <span><span class="sw" style="background:#D1FAE5"></span>under cap</span>
      <span><span class="sw" style="background:#FEF3C7"></span>near cap</span>
      <span><span class="sw" style="background:#FEE2E2"></span>over</span>
    </div>
    <button class="btn btn-primary" id="editPlanBtn">✎ Edit Plan</button>
  </div>

  <div class="calbar">
    <div class="viewsw">
      <button data-view="day">Day</button>
      <button data-view="week">Week</button>
      <button data-view="month">Month</button>
    </div>
    <div class="navgrp">
      <button id="navPrev" title="Previous">‹</button>
      <button id="navToday">Today</button>
      <button id="navNext" title="Next">›</button>
      <button id="navSprint" title="Jump to the open sprint">◆ Current Sprint</button>
    </div>
    <span id="rangeLabel" class="range-label"></span>
  </div>

  <div class="board" id="board">
    <div class="panel panel-left" id="listPanel">
      <div class="lp-head">
        <span class="lp-title">Sprint Items</span>
        <span class="lp-count" id="lpCount">0</span>
        <button class="lp-collapse" id="collapseBtn" title="Collapse list">◀</button>
      </div>
      <div class="lp-sortrow">
        <select class="lp-sort" id="lpSort">
          <option value="rank">Sort: Rank</option>
          <option value="start">Start date</option>
          <option value="due">Due date</option>
          <option value="status">Status</option>
          <option value="assignee">Assignee</option>
        </select>
        <select class="lp-sort" id="lpFilter">
          <option value="all">All statuses</option>
          <option value="todo">To Do</option>
          <option value="wip">In Progress</option>
          <option value="qa">In QA</option>
        </select>
      </div>
      <div class="lp-body" id="listBody"></div>
      <div class="lp-railbtn" id="railBtn"><button class="ex">▶</button><span class="vlabel">Sprint Items</span></div>
    </div>
    <div class="panel cal" id="cal"></div>
  </div>
  <p class="footer" id="footer"></p>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>✎ Edit Plan — Sprint Work</h2>
    <p>Add or remove tickets from the open sprint across IG and V2. Changes apply to Jira.</p>
  </div>
  <div class="drawer-body" id="epBody"></div>
  <div class="drawer-foot">
    <button class="btn" id="epClose" style="flex:1">Close</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="team-board-data.js"></script>
<script src="team-board.js"></script>
<script src="team-board-write.js"></script>
</body>
</html>
